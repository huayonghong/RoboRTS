# RTAB-Map localization parameters for RealSense D455 RGB-D on RoboRTS
# Loaded by vslam_localization.launch.py (node name must be "rtabmap")
#
# These mirror rtabmap_mapping_params.yaml so that localization uses the
# same feature/grid settings as the map that was built, plus:
#   Mem/IncrementalMemory false  -> localization mode (no new map nodes)
#   Mem/InitWMWithAllNodes true  -> load the whole pre-built map up front

rtabmap:
  ros__parameters:
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_odom: true
    frame_id: base_link
    # Must match the mapping launch: RGB-D odometry owns vo -> base_link.
    # Overridden by the launch file when use_ekf:=true.
    odom_frame_id: vo
    map_frame_id: map
    approx_sync: true
    # Reject RGB/depth pairs more than one frame apart (33 ms at 30 FPS).
    approx_sync_max_interval: 0.02
    sync_queue_size: 10
    wait_for_transform: 0.5
    qos_image: 1
    qos_camera_info: 1
    qos_odom: 1

    # Localization mode: open the existing map, never add new nodes.
    Mem/IncrementalMemory: "false"
    Mem/InitWMWithAllNodes: "true"
    Mem/STMSize: "30"

    # Keep publishing /map even when the robot is stationary
    map_always_update: true

    # SLAM graph update thresholds (meters / radians)
    RGBD/CreateOccupancyGrid: "true"
    RGBD/LinearUpdate: "0.05"
    RGBD/AngularUpdate: "0.05"
    RGBD/ProximityBySpace: "true"

    Rtabmap/DetectionRate: "1.0"
    Kp/MaxFeatures: "500"
    Vis/MinInliers: "10"
    Vis/InlierDistance: "0.1"
    Reg/Strategy: "0"
    Reg/Force3DoF: "true"

    # Occupancy grid from depth (Grid/Sensor replaces legacy Grid/FromDepth)
    Grid/Sensor: "1"
    Grid/FromDepth: "true"
    Grid/CellSize: "0.05"
    Grid/RangeMax: "4.0"
    Grid/RangeMin: "0.3"
    Grid/MaxGroundHeight: "0.10"
    Grid/MaxObstacleHeight: "1.5"
    Grid/NormalsSegmentation: "false"
    Grid/NoiseFilteringRadius: "0.0"
    Grid/NoiseFilteringMinNeighbors: "0"
    GridGlobal/MinSize: "20.0"
